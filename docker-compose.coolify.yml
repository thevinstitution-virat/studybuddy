# Study Buddy - production stack for Coolify (same shape as Book Buddy's).
#
# Coolify resource: "Private Repository (with Deploy Key)" -> build pack "Docker Compose",
# compose file /docker-compose.coolify.yml, branch main.
#
# Secrets: every SERVICE_USER_* / SERVICE_PASSWORD_* value below is a Coolify "magic" variable -
# Coolify generates it on the first deploy, keeps it, and shows it under the resource's
# Environment Variables. Nothing secret lives in this file or in git.
#
# Domains are assigned per service in Coolify (Domains field):
#   web -> https://studybuddy.vinstitution.com:3000
#   api -> https://api.studybuddy.vinstitution.com:3000
#
# The app's addresses are written directly in this file, NOT read from Coolify variables:
# Coolify keeps the last value ever stored for a variable and it overrides any default here,
# so a stale APP_URL once broke sign-in and CORS in Book Buddy. To move domain, change them
# here (search for studybuddy.vinstitution.com) and redeploy.
#
# Optional settings are written as ${VAR:-} on purpose: Coolify does NOT enforce the required
# ${VAR:?message} form (it stores the message text as the value). A missing key leaves that
# feature off instead of failing the deploy.
#
# File storage is Cloudflare R2 (no storage container here):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY - from the R2 API token
#   R2_BUCKET_NAME is written below (private bucket `studybuddy`).
#
# Error tracking: GlitchTip at https://errors.vinstitution.com, org "Vidyaverse Trio", projects
# studybuddy-backend (SENTRY_DSN on api) and studybuddy-frontend (SENTRY_DSN + NEXT_PUBLIC_SENTRY_DSN
# on web). DSNs are set in Coolify. NEXT_PUBLIC_SENTRY_DSN is a BUILD arg, so a change needs a redeploy.
#
# Federation with Vidyaverse and the shared library hub stay OFF here (FEDERATION_ENABLED=false,
# no TRIO_* / LIBRARY_HUB_* values): this stack is self-contained until deliberately linked.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: https://api.studybuddy.vinstitution.com
        NEXT_PUBLIC_API_URL: https://api.studybuddy.vinstitution.com
        NEXT_PUBLIC_APP_URL: https://studybuddy.vinstitution.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_API_KEY: ${NEXT_PUBLIC_GOOGLE_API_KEY:-}
        NEXT_PUBLIC_FEDERATION_ENABLED: "false"
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_URL: https://api.studybuddy.vinstitution.com
      NEXT_PUBLIC_APP_URL: https://studybuddy.vinstitution.com
      NEXT_PUBLIC_FEDERATION_ENABLED: "false"
      SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      TZ: Asia/Kolkata
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: Asia/Kolkata
      LOG_LEVEL: info
      # Addresses. BETTER_AUTH_URL is the API host; the web origin is where users land.
      BETTER_AUTH_URL: https://api.studybuddy.vinstitution.com
      NEXT_PUBLIC_APP_URL: https://studybuddy.vinstitution.com
      WEB_ORIGIN: https://studybuddy.vinstitution.com
      CORS_ALLOWED_ORIGINS: https://studybuddy.vinstitution.com
      COOKIE_DOMAIN: .studybuddy.vinstitution.com
      API_URL: https://api.studybuddy.vinstitution.com
      # Internal secrets, generated by Coolify on first deploy.
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_BETTERAUTH}
      JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      ENCRYPTION_KEY: ${SERVICE_PASSWORD_ENCRYPTION}
      HW_CRON_SECRET: ${SERVICE_PASSWORD_HWCRON}
      # Data.
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/studybuddy
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: study_buddy_chunks_v1
      # The platform owner: the only address ever made super-admin.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-thevinstitution@gmail.com}
      # Federation with Vidyaverse stays off until deliberately linked.
      FEDERATION_ENABLED: "false"
      NEXT_PUBLIC_FEDERATION_ENABLED: "false"
      # Cloudflare R2.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: studybuddy
      # AI (empty = that feature reports "not configured").
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY:-}
      AZURE_TRANSLATOR_ENDPOINT: ${AZURE_TRANSLATOR_ENDPOINT:-}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-}
      # Email is logged, not sent, until RESEND_API_KEY is set.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Study Buddy <noreply@vinstitution.com>}
      RESEND_FROM_EMAIL: ${EMAIL_FROM:-Study Buddy <noreply@vinstitution.com>}
      # Google sign-in (callback: https://api.studybuddy.vinstitution.com/api/auth/callback/google).
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      # Error tracking (GlitchTip).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      # Homework evaluator and tutor tiers: same defaults as Digi Classroom; tune in Coolify.
      HW_FEATURE_DEFAULT_ENABLED: ${HW_FEATURE_DEFAULT_ENABLED:-false}
      HW_AI_PROVIDER: ${HW_AI_PROVIDER:-gemini}
      TUTOR_TIERS_ENABLED: ${TUTOR_TIERS_ENABLED:-false}
      TAXONOMY_V2_ENABLED: ${TAXONOMY_V2_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: studybuddy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    # Pinned, same as Book Buddy: the collection format is version-sensitive and Qdrant can
    # upgrade its storage but never downgrade it. Change this deliberately.
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
