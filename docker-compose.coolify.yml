# Study Buddy - production stack for Coolify (same shape as Book Buddy's).
#
# Coolify resource: "Private Repository (with Deploy Key)" -> build pack "Docker Compose",
# compose file /docker-compose.coolify.yml, branch main.
#
# Secrets: every SERVICE_USER_* / SERVICE_PASSWORD_* value below is a Coolify "magic" variable -
# Coolify generates it on the first deploy, keeps it, and shows it under the resource's
# Environment Variables. Nothing secret lives in this file or in git.
#
# Domains are assigned per service in Coolify (Domains field):
#   web -> https://studybuddy.vinstitution.com:3000
#   api -> https://api.studybuddy.vinstitution.com:3000
#
# The app's addresses are written directly in this file, NOT read from Coolify variables:
# Coolify keeps the last value ever stored for a variable and it overrides any default here,
# so a stale APP_URL once broke sign-in and CORS in Book Buddy. To move domain, change them
# here (search for studybuddy.vinstitution.com) and redeploy.
#
# Optional settings are written as ${VAR:-} on purpose: Coolify does NOT enforce the required
# ${VAR:?message} form (it stores the message text as the value). A missing key leaves that
# feature off instead of failing the deploy.
#
# File storage is Cloudflare R2 (no storage container here):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY - from the R2 API token
#   R2_BUCKET_NAME - the private bucket's exact name (default `studybuddy-r2`, the bucket made for Study Buddy). A name that does not exist in that account
#                    shows learners "File storage did not accept this (NoSuchBucket)".
#   R2_ENDPOINT    - only for a bucket created with an EU jurisdiction: https://<ACCOUNT_ID>.eu.r2.cloudflarestorage.com
#                    (default: https://<ACCOUNT_ID>.r2.cloudflarestorage.com, built from R2_ACCOUNT_ID).
#
# Error tracking: GlitchTip at https://errors.vinstitution.com, org "Vidyaverse Trio", projects
# studybuddy-backend (SENTRY_DSN on api) and studybuddy-frontend (SENTRY_DSN + NEXT_PUBLIC_SENTRY_DSN
# on web). DSNs are set in Coolify. NEXT_PUBLIC_SENTRY_DSN is a BUILD arg, so a change needs a redeploy.
#
# Federation with Vidyaverse and the shared library hub stay OFF here (FEDERATION_ENABLED=false,
# no TRIO_* values; LIBRARY_HUB_* are passed through but off until set): this stack is self-contained until deliberately linked.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The web app proxies every /api call to this address (next.config.ts rewrites, baked in at BUILD time).
        # It is the API container on this stack's private network, NOT the public API host. Going out through
        # the public host made the API see the web container as the client for every visitor, so better-auth's
        # per-address limits (8 sign-ins a minute, 120 session checks a minute) were one counter shared by the
        # whole site. Called directly, the API receives the X-Forwarded-For that the proxy set from the real
        # visitor. `api` is this compose file's service name; 3000 is the port the api service listens on.
        API_URL: http://api:3000
        NEXT_PUBLIC_API_URL: https://api.studybuddy.vinstitution.com
        NEXT_PUBLIC_APP_URL: https://studybuddy.vinstitution.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_API_KEY: ${NEXT_PUBLIC_GOOGLE_API_KEY:-}
        NEXT_PUBLIC_FEDERATION_ENABLED: "false"
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_URL: http://api:3000
      NEXT_PUBLIC_APP_URL: https://studybuddy.vinstitution.com
      NEXT_PUBLIC_FEDERATION_ENABLED: "false"
      SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      TZ: Asia/Kolkata
      # Least privilege (Phase 0): Coolify injects every app-level variable into every service, but the web
      # service is only a UI + proxy to the API and must not hold server secrets. Blank them here.
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GEMINI_API_KEY: ""
      RESEND_API_KEY: ""
      AZURE_TRANSLATOR_KEY: ""
      GOOGLE_DRIVE_CLIENT_SECRET: ""
      BETTER_AUTH_SECRET: ""
      JWT_SECRET: ""
      ENCRYPTION_KEY: ""
      HW_CRON_SECRET: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      DATABASE_URL: ""
      REDIS_URL: ""
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # `default` keeps the stack's own network (postgres, redis, qdrant); trio-data adds the shared library database (read-only roles),
    # as Book Buddy does. Never the whole `coolify` network: Coolify's own database answers to `postgres` there.
    networks:
      - default
      - trio-data
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: Asia/Kolkata
      LOG_LEVEL: info
      # Addresses. BETTER_AUTH_URL is the API host; the web origin is where users land.
      BETTER_AUTH_URL: https://api.studybuddy.vinstitution.com
      NEXT_PUBLIC_APP_URL: https://studybuddy.vinstitution.com
      WEB_ORIGIN: https://studybuddy.vinstitution.com
      CORS_ALLOWED_ORIGINS: https://studybuddy.vinstitution.com
      COOKIE_DOMAIN: .studybuddy.vinstitution.com
      API_URL: https://api.studybuddy.vinstitution.com
      # Internal secrets, generated by Coolify on first deploy.
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_BETTERAUTH}
      JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      ENCRYPTION_KEY: ${SERVICE_PASSWORD_ENCRYPTION}
      HW_CRON_SECRET: ${SERVICE_PASSWORD_HWCRON}
      # Data.
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/studybuddy
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: study_buddy_chunks_v1
      # The platform owner: the only address ever made super-admin.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-thevinstitution@gmail.com}
      # Federation with Vidyaverse stays off until deliberately linked.
      FEDERATION_ENABLED: "false"
      NEXT_PUBLIC_FEDERATION_ENABLED: "false"
      # Cloudflare R2.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-studybuddy-r2}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      # AI (empty = that feature reports "not configured").
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY:-}
      AZURE_TRANSLATOR_ENDPOINT: ${AZURE_TRANSLATOR_ENDPOINT:-}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-}
      # Email is logged, not sent, until RESEND_API_KEY is set.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Study Buddy <noreply@vinstitution.com>}
      RESEND_FROM_EMAIL: ${EMAIL_FROM:-Study Buddy <noreply@vinstitution.com>}
      # Google sign-in (callback: https://api.studybuddy.vinstitution.com/api/auth/callback/google).
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      # Error tracking (GlitchTip).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      # Homework evaluator and tutor tiers: same defaults as Digi Classroom; tune in Coolify.
      HW_FEATURE_DEFAULT_ENABLED: ${HW_FEATURE_DEFAULT_ENABLED:-false}
      HW_AI_PROVIDER: ${HW_AI_PROVIDER:-gemini}
      # Models and marking: set in Coolify as on Digi Classroom (empty = the code's default or "not configured").
      HW_READ_MODEL: ${HW_READ_MODEL:-}
      HW_ESCALATE_MODEL: ${HW_ESCALATE_MODEL:-}
      HW_GRADE_MODEL: ${HW_GRADE_MODEL:-}
      HW_RUBRIC_MODEL: ${HW_RUBRIC_MODEL:-}
      HW_THINKING_LEVEL: ${HW_THINKING_LEVEL:-}
      HW_GRADE_REASONING_EFFORT: ${HW_GRADE_REASONING_EFFORT:-}
      HW_PRICE_TABLE_JSON: ${HW_PRICE_TABLE_JSON:-}
      # Batching (half price, minutes to hours): on by default; work of HW_BATCH_SMALL_MAX answers or fewer is never batched.
      HW_BATCH_ENABLED: ${HW_BATCH_ENABLED:-true}
      HW_BATCH_SMALL_MAX: ${HW_BATCH_SMALL_MAX:-5}
      # InkBuddy's teacher's pen (remark and underlines after a mark): off until set to true.
      HW_TEACHER_PEN_ENABLED: ${HW_TEACHER_PEN_ENABLED:-false}
      HW_STRICT_MARKING_ENABLED: ${HW_STRICT_MARKING_ENABLED:-}
      HW_INSTRUCTION_GUARD_ENABLED: ${HW_INSTRUCTION_GUARD_ENABLED:-}
      HW_ELIGIBILITY_ENFORCED: ${HW_ELIGIBILITY_ENFORCED:-}
      # Answer keys (InkBuddy builds one per question from the textbook).
      HW_KEY_WRITER_PROVIDER: ${HW_KEY_WRITER_PROVIDER:-}
      HW_KEY_WRITER_MODEL: ${HW_KEY_WRITER_MODEL:-}
      HW_KEY_VERIFIER_PROVIDER: ${HW_KEY_VERIFIER_PROVIDER:-}
      HW_KEY_VERIFIER_MODEL: ${HW_KEY_VERIFIER_MODEL:-}
      HW_KEY_R_MIN: ${HW_KEY_R_MIN:-}
      HW_KEY_ALLOW_SAME_FAMILY: ${HW_KEY_ALLOW_SAME_FAMILY:-}
      HW_SHARED_KEYS_ENABLED: ${HW_SHARED_KEYS_ENABLED:-}
      # InkBuddy (self-practice): off until HW_SELF_PRACTICE_ENABLED=true. Classes and subjects come from the library.
      HW_SELF_PRACTICE_ENABLED: ${HW_SELF_PRACTICE_ENABLED:-false}
      HW_SELF_PRACTICE_REQUIRE_ELIGIBLE_GROUP: ${HW_SELF_PRACTICE_REQUIRE_ELIGIBLE_GROUP:-}
      HW_SELF_PRACTICE_SCOPES: ${HW_SELF_PRACTICE_SCOPES:-}
      HW_SELF_PRACTICE_TRIAL_DAYS: ${HW_SELF_PRACTICE_TRIAL_DAYS:-}
      HW_SELF_PRACTICE_TRIAL_BUDGET_PAISE: ${HW_SELF_PRACTICE_TRIAL_BUDGET_PAISE:-}
      HW_SELF_PRACTICE_PLATFORM_BUDGET_PAISE: ${HW_SELF_PRACTICE_PLATFORM_BUDGET_PAISE:-}
      HW_SELF_PRACTICE_MAX_ATTEMPTS: ${HW_SELF_PRACTICE_MAX_ATTEMPTS:-}
      # Every other Virat Evaluator setting the code reads (config.ts), so a value set in Coolify reaches the api as on Digi Classroom
      # (exam packages, parent view, InkBuddy board questions, monitoring, ...). Empty = the code's default.
      HW_BATCH_MAX_BYTES: ${HW_BATCH_MAX_BYTES:-}
      HW_BATCH_POLL_SECONDS: ${HW_BATCH_POLL_SECONDS:-}
      HW_CODE_MARKING_ENABLED: ${HW_CODE_MARKING_ENABLED:-}
      HW_DEDUPE_MARKING_ENABLED: ${HW_DEDUPE_MARKING_ENABLED:-}
      HW_ESCALATE_PROVIDER: ${HW_ESCALATE_PROVIDER:-}
      HW_EVAL_TOOLS_ENABLED: ${HW_EVAL_TOOLS_ENABLED:-}
      HW_EXAMS_AUTHORED_AI_ENABLED: ${HW_EXAMS_AUTHORED_AI_ENABLED:-}
      HW_EXAMS_BATCH_ENABLED: ${HW_EXAMS_BATCH_ENABLED:-}
      HW_EXAMS_BATCH_HOURS: ${HW_EXAMS_BATCH_HOURS:-}
      HW_EXAMS_ENABLED: ${HW_EXAMS_ENABLED:-}
      HW_EXAMS_EVAL_MAX_TRIES: ${HW_EXAMS_EVAL_MAX_TRIES:-}
      HW_EXAMS_EVAL_PER_PASS: ${HW_EXAMS_EVAL_PER_PASS:-}
      HW_EXAMS_PLATFORM_BUDGET_PAISE: ${HW_EXAMS_PLATFORM_BUDGET_PAISE:-}
      HW_EXAMS_READ_SPLIT: ${HW_EXAMS_READ_SPLIT:-}
      HW_EXAMS_SHEET_VISION: ${HW_EXAMS_SHEET_VISION:-}
      HW_EXAMS_WRITING_PROFILE: ${HW_EXAMS_WRITING_PROFILE:-}
      HW_GRADE_BATCH_SIZE: ${HW_GRADE_BATCH_SIZE:-}
      HW_GRADE_DEBOUNCE_SECONDS: ${HW_GRADE_DEBOUNCE_SECONDS:-}
      HW_GRADE_PROVIDER: ${HW_GRADE_PROVIDER:-}
      HW_HIGH_CONFIDENCE: ${HW_HIGH_CONFIDENCE:-}
      HW_HOMEWORK_BATCH_DEADLINE_HOURS: ${HW_HOMEWORK_BATCH_DEADLINE_HOURS:-}
      HW_HOMEWORK_BATCH_ENABLED: ${HW_HOMEWORK_BATCH_ENABLED:-}
      HW_HOMEWORK_URGENT_HOURS: ${HW_HOMEWORK_URGENT_HOURS:-}
      HW_INKBUDDY_POOL_AI_ENABLED: ${HW_INKBUDDY_POOL_AI_ENABLED:-}
      HW_INK_MAX_BYTES: ${HW_INK_MAX_BYTES:-}
      HW_JOB_STALE_MINUTES: ${HW_JOB_STALE_MINUTES:-}
      HW_KEY_EMBED_MODEL: ${HW_KEY_EMBED_MODEL:-}
      HW_KEY_EXERCISE_THETA: ${HW_KEY_EXERCISE_THETA:-}
      HW_KEY_MAX_PASSAGES: ${HW_KEY_MAX_PASSAGES:-}
      HW_KEY_PAGES_VERIFIED: ${HW_KEY_PAGES_VERIFIED:-}
      HW_KEY_TOP_K: ${HW_KEY_TOP_K:-}
      HW_MONITOR_AUTODEMOTE: ${HW_MONITOR_AUTODEMOTE:-}
      HW_MONITOR_MAX_COST_RATIO: ${HW_MONITOR_MAX_COST_RATIO:-}
      HW_MONITOR_MAX_FAILED_JOB_RATE: ${HW_MONITOR_MAX_FAILED_JOB_RATE:-}
      HW_MONITOR_MAX_LARGE_OVERRIDE_RATE: ${HW_MONITOR_MAX_LARGE_OVERRIDE_RATE:-}
      HW_MONITOR_MAX_OVERRIDE_RATE: ${HW_MONITOR_MAX_OVERRIDE_RATE:-}
      HW_MONITOR_MAX_TRANSCRIPT_FIX_RATE: ${HW_MONITOR_MAX_TRANSCRIPT_FIX_RATE:-}
      HW_MONITOR_MIN_ANSWERS: ${HW_MONITOR_MIN_ANSWERS:-}
      HW_MONITOR_MIN_GROUP_SIZE: ${HW_MONITOR_MIN_GROUP_SIZE:-}
      HW_MONITOR_PROJECTED_PAISE_JSON: ${HW_MONITOR_PROJECTED_PAISE_JSON:-}
      HW_OPENAI_EXPLICIT_CACHE_ENABLED: ${HW_OPENAI_EXPLICIT_CACHE_ENABLED:-}
      HW_PARENT_VIEW_ENABLED: ${HW_PARENT_VIEW_ENABLED:-}
      HW_PARTIAL_CREDIT_BY_SUBJECT: ${HW_PARTIAL_CREDIT_BY_SUBJECT:-}
      HW_PARTIAL_CREDIT_RULE: ${HW_PARTIAL_CREDIT_RULE:-}
      HW_READ_ESCALATE_BELOW: ${HW_READ_ESCALATE_BELOW:-}
      HW_READ_MEDIA_RESOLUTION: ${HW_READ_MEDIA_RESOLUTION:-}
      HW_READ_PROVIDER: ${HW_READ_PROVIDER:-}
      HW_RENDER_MAX_BYTES: ${HW_RENDER_MAX_BYTES:-}
      HW_RENDER_MAX_WIDTH: ${HW_RENDER_MAX_WIDTH:-}
      HW_RUBRIC_PROVIDER: ${HW_RUBRIC_PROVIDER:-}
      HW_SELF_PRACTICE_MAX_ATTEMPTS_PER_QUESTION: ${HW_SELF_PRACTICE_MAX_ATTEMPTS_PER_QUESTION:-}
      HW_SELF_PRACTICE_STEP_RESERVE_PAISE: ${HW_SELF_PRACTICE_STEP_RESERVE_PAISE:-}
      HW_SHADOW_CONFIG_JSON: ${HW_SHADOW_CONFIG_JSON:-}
      HW_SHADOW_RATE: ${HW_SHADOW_RATE:-}
      HW_TEACHER_RUBRIC_AI_ENABLED: ${HW_TEACHER_RUBRIC_AI_ENABLED:-}
      HW_UNCLEAR_ESCALATE_ABOVE: ${HW_UNCLEAR_ESCALATE_ABOVE:-}
      # The shared library (PDLMS hub, read-only). Off until LIBRARY_HUB_ENABLED=true; values as on Digi Classroom,
      # ideally with Study Buddy's own hub app id and secret.
      LIBRARY_HUB_ENABLED: ${LIBRARY_HUB_ENABLED:-false}
      LIBRARY_HUB_URL: ${LIBRARY_HUB_URL:-}
      LIBRARY_HUB_APP_ID: ${LIBRARY_HUB_APP_ID:-}
      LIBRARY_HUB_SECRET: ${LIBRARY_HUB_SECRET:-}
      LIBRARY_QDRANT_URL: ${LIBRARY_QDRANT_URL:-}
      LIBRARY_QDRANT_API_KEY: ${LIBRARY_QDRANT_API_KEY:-}
      LIBRARY_QDRANT_COLLECTION: ${LIBRARY_QDRANT_COLLECTION:-}
      LIBRARY_READER_DATABASE_URL: ${LIBRARY_READER_DATABASE_URL:-}
      LIBRARY_EVALUATOR_DATABASE_URL: ${LIBRARY_EVALUATOR_DATABASE_URL:-}
      LIBRARY_GRAPH_ENABLED: ${LIBRARY_GRAPH_ENABLED:-false}
      TUTOR_TIERS_ENABLED: ${TUTOR_TIERS_ENABLED:-false}
      TAXONOMY_V2_ENABLED: ${TAXONOMY_V2_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: studybuddy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    # Pinned, same as Book Buddy: the collection format is version-sensitive and Qdrant can
    # upgrade its storage but never downgrade it. Change this deliberately.
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant-data:/qdrant/storage

# Holds the shared library database and the APIs that read it (Book Buddy's, this one), so Study Buddy can read the library without
# joining the whole `coolify` network. It already exists on the server (made for Book Buddy). The library database container joins it
# by hand, once:  docker network connect trio-data sn7jgws05e0uq48u31u5ezr8
# A missing external network stops the deploy.
networks:
  trio-data:
    external: true

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
